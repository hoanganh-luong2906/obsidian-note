<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><rect width="900" height="400" fill="#ffffff"/><text x="450.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Spring (rũ bỏ) vs phá vỡ thật</text><rect x="15" y="50" width="425" height="335" rx="10" fill="#f9fafb" stroke="#e5e7eb"/><text x="227.5" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Spring — lấy lại hỗ trợ trong 1–3 phiên</text><line x1="35" y1="210" x2="425" y2="210" stroke="#7c3aed" stroke-dasharray="6 4"/><text x="415" y="204" text-anchor="end" font-size="11" font-weight="400" fill="#7c3aed">hỗ trợ đáy nền</text><polyline points="45,150 75,200 105,140 135,205 165,145 195,195 225,240 250,200 280,160 315,150 355,120 405,100" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" opacity="1"/><circle cx="225" cy="240" r="8" fill="none" stroke="#16a34a" stroke-width="3"/><text x="227" y="318" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">• Đã có nền nhiều tuần, MA dẹt</text><text x="227" y="336" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">• Thủng với vol thấp hoặc rút chân mạnh</text><text x="227" y="354" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">• Tin xấu không giảm thêm · chỉ xác nhận SAU</text><rect x="460" y="50" width="425" height="335" rx="10" fill="#f9fafb" stroke="#e5e7eb"/><text x="672.5" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Breakdown thật — nằm dưới hỗ trợ</text><line x1="480" y1="210" x2="870" y2="210" stroke="#7c3aed" stroke-dasharray="6 4"/><text x="860" y="204" text-anchor="end" font-size="11" font-weight="400" fill="#7c3aed">hỗ trợ đáy nền</text><polyline points="490,150 520,200 550,140 580,205 610,145 640,195 670,240 695,225 725,250 760,235 800,270 850,285" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" opacity="1"/><circle cx="670" cy="240" r="8" fill="none" stroke="#dc2626" stroke-width="3"/><text x="672" y="318" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">• Đang Stage 4, MA dốc xuống</text><text x="672" y="336" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">• Vol cao, đóng cửa gần đáy</text><text x="672" y="354" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">• Hồi bị bán ngay (hỗ trợ cũ → kháng cự)</text></svg>