<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><rect width="900" height="500" fill="#ffffff"/><text x="450.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">3 Weeks Tight — khung TUẦN, đo trên giá ĐÓNG CỬA</text><g><line x1="60" y1="300" x2="60" y2="360" stroke="#16a34a" stroke-width="2"/><rect x="49.0" y="310" width="22" height="40" fill="#16a34a" stroke="#16a34a" stroke-width="2"/></g><rect x="49" y="434.0" width="22" height="36.0" fill="#16a34a" opacity="0.5"/><g><line x1="100" y1="262" x2="100" y2="320" stroke="#16a34a" stroke-width="2"/><rect x="89.0" y="270" width="22" height="42" fill="#16a34a" stroke="#16a34a" stroke-width="2"/></g><rect x="89" y="429.2" width="22" height="40.8" fill="#16a34a" opacity="0.5"/><g><line x1="140" y1="230" x2="140" y2="282" stroke="#16a34a" stroke-width="2"/><rect x="129.0" y="238" width="22" height="37" fill="#16a34a" stroke="#16a34a" stroke-width="2"/></g><rect x="129" y="424.4" width="22" height="45.6" fill="#16a34a" opacity="0.5"/><g><line x1="180" y1="190" x2="180" y2="250" stroke="#16a34a" stroke-width="2"/><rect x="169.0" y="195" width="22" height="47" fill="#16a34a" stroke="#16a34a" stroke-width="2"/></g><rect x="169" y="404.0" width="22" height="66.0" fill="#16a34a" opacity="0.5"/><g><line x1="220" y1="176" x2="220" y2="206" stroke="#dc2626" stroke-width="2"/><rect x="209.0" y="185" width="22" height="15" fill="#dc2626" stroke="#dc2626" stroke-width="2"/></g><rect x="209" y="434.0" width="22" height="36.0" fill="#dc2626" opacity="0.5"/><g><line x1="260" y1="172" x2="260" y2="202" stroke="#16a34a" stroke-width="2"/><rect x="249.0" y="183" width="22" height="12" fill="#16a34a" stroke="#16a34a" stroke-width="2"/></g><rect x="249" y="441.2" width="22" height="28.8" fill="#16a34a" opacity="0.5"/><g><line x1="300" y1="174" x2="300" y2="198" stroke="#16a34a" stroke-width="2"/><rect x="289.0" y="182" width="22" height="8" fill="#16a34a" stroke="#16a34a" stroke-width="2"/></g><rect x="289" y="448.4" width="22" height="21.6" fill="#16a34a" opacity="0.5"/><g><line x1="340" y1="170" x2="340" y2="199" stroke="#16a34a" stroke-width="2"/><rect x="329.0" y="183" width="22" height="9" fill="#16a34a" stroke="#16a34a" stroke-width="2"/></g><rect x="329" y="453.2" width="22" height="16.8" fill="#16a34a" opacity="0.5"/><g><line x1="380" y1="120" x2="380" y2="188" stroke="#16a34a" stroke-width="2"/><rect x="369.0" y="128" width="22" height="55" fill="#16a34a" stroke="#16a34a" stroke-width="2"/></g><rect x="369" y="395.6" width="22" height="74.4" fill="#16a34a" opacity="0.5"/><g><line x1="420" y1="95" x2="420" y2="140" stroke="#16a34a" stroke-width="2"/><rect x="409.0" y="100" width="22" height="32" fill="#16a34a" stroke="#16a34a" stroke-width="2"/></g><rect x="409" y="412.4" width="22" height="57.6" fill="#16a34a" opacity="0.5"/><rect x="240" y="160" width="120" height="56" rx="6" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><text x="300" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">3 tuần close ≤1,5%</text><circle cx="260" cy="183" r="3.5" fill="#2563eb"/><circle cx="300" cy="182" r="3.5" fill="#2563eb"/><circle cx="340" cy="183" r="3.5" fill="#2563eb"/><line x1="200" y1="172" x2="440" y2="172" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="445" y="176" text-anchor="start" font-size="11" font-weight="700" fill="#16a34a">Pivot</text><line x1="200" y1="202" x2="440" y2="202" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="445" y="206" text-anchor="start" font-size="11" font-weight="700" fill="#dc2626">Stop (≈3–6%)</text><circle cx="380" cy="150" r="9" fill="none" stroke="#16a34a" stroke-width="3"/><text x="365" y="108" text-anchor="end" font-size="11" font-weight="700" fill="#16a34a">Breakout tuần</text><text x="300" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7280">vol cạn dần</text><text x="380" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">vol bùng</text><line x1="40" y1="426.8" x2="440" y2="426.8" stroke="#f59e0b" stroke-dasharray="5 4"/><text x="445" y="430.8" text-anchor="start" font-size="10" font-weight="400" fill="#b45309">MA vol</text><text x="575" y="80" text-anchor="start" font-size="12" font-weight="700" fill="#2563eb">Điều kiện:</text><text x="575" y="102" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Pivot = high cao nhất 3 tuần</text><text x="575" y="124" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Stop = dưới low vùng nén</text><text x="575" y="146" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Uptrend: giá trên MA20 trên MA50</text><text x="575" y="168" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Cách MA20 dưới 10–15%</text><text x="575" y="190" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Cả vùng nén dưới 8–10%</text><text x="575" y="212" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Tuần cuối vol thấp nhất</text><text x="575" y="234" text-anchor="start" font-size="12" font-weight="700" fill="#2563eb">Hiệu chỉnh VN:</text><text x="575" y="256" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Loại tuần dưới 4 phiên (Tết, 30/4, 2/9, 1/1)</text><text x="575" y="278" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• GTGD khớp TB20 ≥10–20 tỷ</text><text x="575" y="300" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Kiểm close T6 tuần đáo hạn/ETF</text><text x="575" y="322" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• T+2: size 50–70%, stop theo close tuần</text><text x="575" y="344" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Ngưỡng: VN30 1,5–2% · midcap 2–3%</text></svg>