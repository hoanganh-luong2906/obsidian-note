<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><rect width="900" height="470" fill="#ffffff"/><text x="450.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Sóng Elliott 5-3 — tỷ lệ Fibonacci hiệu chỉnh cho VN</text><polyline points="50,390 150,260 210,340 420,90 500,170 600,70 670,180 720,130 830,280" fill="none" stroke="#1f2937" stroke-width="2.8" stroke-linejoin="round" opacity="1"/><circle cx="150" cy="260" r="15" fill="#dcfce7" stroke="#1f2937"/><text x="150" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1</text><circle cx="210" cy="340" r="15" fill="#f3f4f6" stroke="#1f2937"/><text x="210" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2</text><circle cx="420" cy="90" r="15" fill="#dcfce7" stroke="#1f2937"/><text x="420" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3</text><circle cx="500" cy="170" r="15" fill="#f3f4f6" stroke="#1f2937"/><text x="500" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4</text><circle cx="600" cy="70" r="15" fill="#dcfce7" stroke="#1f2937"/><text x="600" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">5</text><circle cx="670" cy="180" r="15" fill="#fee2e2" stroke="#1f2937"/><text x="670" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">A</text><circle cx="720" cy="130" r="15" fill="#f3f4f6" stroke="#1f2937"/><text x="720" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">B</text><circle cx="830" cy="280" r="15" fill="#fee2e2" stroke="#1f2937"/><text x="830" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">C</text><line x1="50" y1="260" x2="620" y2="260" stroke="#dc2626" stroke-dasharray="4 4" opacity="0.6"/><text x="230" y="254" text-anchor="start" font-size="11" font-weight="400" fill="#dc2626">Đỉnh sóng 1 — sóng 4 không được đi vào vùng này</text><text x="215" y="375" text-anchor="start" font-size="12" font-weight="600" fill="#1d4ed8">Sóng 2: 50–78,6% S1 (margin overshoot)</text><text x="300" y="150" text-anchor="end" font-size="12" font-weight="600" fill="#1d4ed8">Sóng 3: ≈1,618×S1</text><text x="300" y="168" text-anchor="end" font-size="12" font-weight="600" fill="#1d4ed8">vol cao nhất, chuỗi trần</text><text x="512" y="205" text-anchor="start" font-size="12" font-weight="600" fill="#1d4ed8">Sóng 4: 23,6–50% S3, vol thấp</text><text x="560" y="52" text-anchor="start" font-size="12" font-weight="600" fill="#1d4ed8">Sóng 5 ≈ S1, phân kỳ vol/RSI</text><text x="560" y="320" text-anchor="start" font-size="12" font-weight="600" fill="#1d4ed8">C ≈ 1,618×A (phổ biến ở VN)</text><rect x="40" y="410" width="820" height="46" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="450" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">3 quy tắc: S2 không thoái lui quá 100% S1 · S3 không ngắn nhất · S4 không chạm vùng S1</text><text x="450" y="448" text-anchor="middle" font-size="11" font-weight="400" fill="#9a3412">Chỉ đếm khung ≥ D1 · free-float &gt; 15% · dùng để đo biên độ SAU khi Stage/Vol/VCP đã xác nhận</text></svg>