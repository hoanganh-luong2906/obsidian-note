<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><rect width="900" height="600" fill="#ffffff"/><text x="450.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Ma trận giá × khối lượng — đọc kèm vị trí trong chu kỳ</text><text x="290" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#6b7280">VOL THẤP</text><text x="660" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#6b7280">VOL CAO</text><text x="40" y="200" transform="rotate(-90 40 200)" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">GIÁ TĂNG</text><text x="40" y="440" transform="rotate(-90 40 440)" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">GIÁ GIẢM</text><rect x="105" y="75" width="355" height="225" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-opacity="0.3"/><text x="282" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#854d0e">Tăng yếu — thiếu xác nhận</text><text x="282" y="120" text-anchor="middle" font-size="11" font-weight="400" fill="#854d0e">Hồi kỹ thuật / kéo xả → không đuổi</text><polyline points="145,225 183,220 221,203 259,198 297,181 335,176 373,159 411,154" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/><rect x="138" y="275.2" width="14" height="9.8" fill="#16a34a" opacity="0.55"/><rect x="176" y="276.6" width="14" height="8.4" fill="#16a34a" opacity="0.55"/><rect x="214" y="277.3" width="14" height="7.7" fill="#16a34a" opacity="0.55"/><rect x="252" y="278" width="14" height="7" fill="#16a34a" opacity="0.55"/><rect x="290" y="278.7" width="14" height="6.3" fill="#16a34a" opacity="0.55"/><rect x="328" y="279.4" width="14" height="5.6" fill="#16a34a" opacity="0.55"/><rect x="366" y="279.4" width="14" height="5.6" fill="#16a34a" opacity="0.55"/><rect x="404" y="280.1" width="14" height="4.9" fill="#16a34a" opacity="0.55"/><rect x="475" y="75" width="3