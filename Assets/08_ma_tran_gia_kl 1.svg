ct x="252" y="518" width="14" height="7" fill="#dc2626" opacity="0.55"/><rect x="290" y="518.7" width="14" height="6.3" fill="#dc2626" opacity="0.55"/><rect x="328" y="519.4" width="14" height="5.6" fill="#dc2626" opacity="0.55"/><rect x="366" y="520.1" width="14" height="4.9" fill="#dc2626" opacity="0.55"/><rect x="404" y="520.8" width="14" height="4.2" fill="#dc2626" opacity="0.55"/><text x="450" y="383" text-anchor="end" font-size="10" font-style="italic" fill="#075985">Trong Stage 4: "không ai mua", chưa phải "hết người bán"</text><rect x="475" y="315" width="355" height="225" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-opacity="0.3"/><text x="652" y="341" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Bán tháo / phân phối</text><text x="652" y="360" text-anchor="middle" font-size="11" font-weight="400" fill="#991b1b">Cung áp đảo → đứng ngoài</text><polyline points="515,390 553,395 591,412 629,417 667,434 705,439 743,456 781,461" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/><rect x="508" y="513.8" width="14" height="11.2" fill="#dc2626" opacity="0.55"/><rect x="546" y="509.6" width="14" height="15.4" fill="#dc2626" opacity="0.55"/><rect x="584" y="504" width="14" height="21" fill="#dc2626" opacity="0.55"/><rect x="622" y="497" width="14" height="28" fill="#dc2626" opacity="0.55"/><rect x="660" y="490" width="14" height="35" fill="#dc2626" opacity="0.55"/><rect x="698" y="485.8" width="14" height="39.2" fill="#dc2626" opacity="0.55"/><rect x="736" y="483" width="14" height="42" fill="#dc2626" opacity="0.55"/><rect x="774" y="478.8" width="14" height="46.2" fill="#dc2626" opacity="0.55"/><text x="820" y="383" text-anchor="end" font-size="10" font-style="italic" fill="#991b1b">Ở đáy dài hạn: có thể là bán tháo đỉnh điểm</text><rect x="60" y="552" width="780" height="38" rx="8" fill="#f3f4f6"/><text x="450" y="576" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Luôn dùng vol KHỚP LỆNH (loại t