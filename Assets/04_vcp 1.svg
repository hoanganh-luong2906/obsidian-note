<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><rect width="900" height="480" fill="#ffffff"/><text x="450.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">VCP — nền co hẹp dần, vol cạn dần, breakout vol lớn</text><rect x="120" y="100" width="305" height="165" fill="#eff6ff" opacity="0.7"/><line x1="100" y1="110" x2="520" y2="110" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text x="100" y="102" text-anchor="start" font-size="12" font-weight="700" fill="#2563eb">Pivot (đỉnh nền)</text><polyline points="40,330 90,230 120,110 165,250 200,125 240,215 270,118 305,172 335,115 360,142 385,114 405,126 425,112 445,80 470,90 500,58" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" opacity="1"/><text x="156.5" y="180.0" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">−25%</text><text x="234.0" y="170.0" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">−12%</text><text x="301.5" y="145.0" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">−6%</text><text x="361.5" y="128.5" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">−3%</text><circle cx="445" cy="80" r="8" fill="none" stroke="#16a34a" stroke-width="3"/><text x="420" y="72" text-anchor="end" font-size="12" font-weight="700" fill="#16a34a">Breakout</text><line x1="330" y1="150" x2="440" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/><text x="335" y="166" text-anchor="start" font-size="11" font-weight="400" fill="#dc2626">Stop: dưới đáy nhịp co cuối</text><rect x="52" y="385" width="16" height="55" fill="#9ca3af"/><rect x="87" y="380" width="16" height="60" fill="#9ca3af"/><rect x="117" y="390" width="16" height="50" fill="#9ca3af"/><rect x="142" y="378" width="16" height="62" fill="#9ca3af"/><rect x="172" y="396" width="16" height="44" fill="#9ca3af"/><rect x="202" y="400" width="16" height="40" fill="#9ca3af"/><rect x="232" y="406" width="16" height="34" fill="#9ca3af"/><rect x="262" y="410" width="16" height="30" fill="#9ca3af"/><rect x="292" y="416" width="16" height="24" fill="#9ca3af"/><rect x="322" y="420" width="16" height="20" fill="#9ca3af"/><rect x="347" y="425" width="16" height="15" fill="#9ca3af"/><rect x="372" y="428" width="16" height="12" fill="#9ca3af"/><rect x="397" y="430" width="16" height="10" fill="#9ca3af"/><rect x="422" y="431" width="16" height="9" fill="#9ca3af"/><rect x="440" y="378" width="16" height="62" fill="#16a34a"/><rect x="467" y="392" width="16" height="48" fill="#16a34a"/><rect x="492" y="400" width="16" height="40" fill="#16a34a"/><line x1="40" y1="410" x2="520" y2="410" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="525" y="414" text-anchor="start" font-size="11" font-weight="400" fill="#b45309">TB50 vol</text><text x="460" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">≥1,5× TB50</text><text x="300" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">Vol cạn (VDU)</text><text x="620" y="90" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">Điều kiện:</text><text x="620" y="114" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">• Trước đó đã là Stage 2</text><text x="620" y="138" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">  (trên MA50, MA50 dốc lên)</text><text x="620" y="162" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">• Mỗi nhịp co ≈ ½ nhịp trước</text><text x="620" y="186" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">• Đã có ít nhất 1 nhịp rũ thật</text><text x="620" y="210" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">• Nền thứ 1–2 kể từ đáy Stage 1</text><text x="620" y="234" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">• Giữ pivot qua phiên T+2/T+3</text><text x="620" y="258" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">Không mua giữa nền —</text><text x="620" y="282" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">chỉ mua khi vượt pivot</text><text x="620" y="306" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">kèm vol khớp lệnh.</text></svg>