<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 775" width="1200" height="775">
<defs><style>text{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker></defs>
<rect x="0" y="0" width="1200" height="775" rx="14" fill="#ffffff"/>
<text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Chu kỳ kinh tế &amp; nhóm ngành hưởng lợi — phiên bản Việt Nam</text>
<text x="600" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Khung Fidelity (business cycle) hiệu chỉnh theo chu kỳ tín dụng – lãi suất của VN. Mã cổ phiếu chỉ là ví dụ đại diện, không phải khuyến nghị.</text>
<rect x="60" y="80" width="270" height="250" fill="#dcfce7" opacity="0.55"/>
<text x="195" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">1. PHỤC HỒI (Early)</text>
<rect x="330" y="80" width="270" height="250" fill="#dbeafe" opacity="0.55"/>
<text x="465" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">2. MỞ RỘNG (Mid)</text>
<rect x="600" y="80" width="270" height="250" fill="#ffedd5" opacity="0.55"/>
<text x="735" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c">3. QUÁ NHIỆT (Late)</text>
<rect x="870" y="80" width="270" height="250" fill="#fee2e2" opacity="0.55"/>
<text x="1005" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">4. SUY THOÁI (Recession)</text>
<path d="M60,300 C250,300 500,125 735,120 C900,118 1000,300 1140,300" fill="none" stroke="#111827" stroke-width="3.5"/>
<path d="M60,262 C250,190 450,120 600,120 C760,120 880,318 990,318 C1060,318 1100,290 1140,262" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 6"/>
<line x1="600" y1="122" x2="600" y2="176" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 3"/><line x1="735" y1="122" x2="735" y2="176" stroke="#111827" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="604" y1="172" x2="729" y2="172" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>
<text x="667" y="190" text-anchor="middle" font-size="12" fill="#7c3aed">đỉnh TTCK đến trước</text>
<line x1="70" y1="346" x2="105" y2="346" stroke="#111827" stroke-width="3.5"/><text x="112" y="350" font-size="13" fill="#111827">Kinh tế (GDP, lợi nhuận DN)</text>
<line x1="330" y1="346" x2="365" y2="346" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 6"/><text x="372" y="350" font-size="13" fill="#7c3aed">Thị trường chứng khoán — thường đi trước kinh tế khoảng 6 tháng</text>
<text x="990" y="350" text-anchor="middle" font-size="12" fill="#7c3aed">đáy TTCK: khi tin xấu nhất</text>
<circle cx="800" cy="128" r="9" fill="#b91c1c" stroke="#fff" stroke-width="2"/>
<rect x="896" y="116" width="238" height="44" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="1015" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">VN 30/9/2026 (diễn giải)</text>
<text x="1015" y="151" text-anchor="middle" font-size="11" fill="#374151">GDP cao · CPI ~4,3–4,5% · lãi suất tăng</text>
<line x1="809" y1="128" x2="905" y2="136" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="66" y="364" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="78" y="381.5" font-size="12.5" font-weight="700" fill="#374151">Lãi suất:</text>
<text x="160" y="381.5" font-size="12.5" fill="#374151">Thấp, đang nới</text>
<rect x="336" y="364" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="348" y="381.5" font-size="12.5" font-weight="700" fill="#374151">Lãi suất:</text>
<text x="430" y="381.5" font-size="12.5" fill="#374151">Trung tính, tín dụng mạnh</text>
<rect x="606" y="364" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="618" y="381.5" font-size="12.5" font-weight="700" fill="#374151">Lãi suất:</text>
<text x="700" y="381.5" font-size="12.5" fill="#374151">Tăng, thanh khoản căng</text>
<rect x="876" y="364" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="888" y="381.5" font-size="12.5" font-weight="700" fill="#374151">Lãi suất:</text>
<text x="970" y="381.5" font-size="12.5" fill="#374151">Bắt đầu nới</text>
<rect x="66" y="396" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="78" y="413.5" font-size="12.5" font-weight="700" fill="#374151">Lạm phát:</text>
<text x="160" y="413.5" font-size="12.5" fill="#374151">Thấp</text>
<rect x="336" y="396" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="348" y="413.5" font-size="12.5" font-weight="700" fill="#374151">Lạm phát:</text>
<text x="430" y="413.5" font-size="12.5" fill="#374151">Nhích dần</text>
<rect x="606" y="396" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="618" y="413.5" font-size="12.5" font-weight="700" fill="#374151">Lạm phát:</text>
<text x="700" y="413.5" font-size="12.5" fill="#374151">Cao nhất chu kỳ</text>
<rect x="876" y="396" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="888" y="413.5" font-size="12.5" font-weight="700" fill="#374151">Lạm phát:</text>
<text x="970" y="413.5" font-size="12.5" fill="#374151">Hạ nhiệt</text>
<rect x="66" y="428" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="78" y="445.5" font-size="12.5" font-weight="700" fill="#374151">Lợi nhuận:</text>
<text x="160" y="445.5" font-size="12.5" fill="#374151">Phục hồi nhanh nhất</text>
<rect x="336" y="428" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="348" y="445.5" font-size="12.5" font-weight="700" fill="#374151">Lợi nhuận:</text>
<text x="430" y="445.5" font-size="12.5" fill="#374151">Tăng đều</text>
<rect x="606" y="428" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="618" y="445.5" font-size="12.5" font-weight="700" fill="#374151">Lợi nhuận:</text>
<text x="700" y="445.5" font-size="12.5" fill="#374151">Biên LN co lại</text>
<rect x="876" y="428" width="258" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="888" y="445.5" font-size="12.5" font-weight="700" fill="#374151">Lợi nhuận:</text>
<text x="970" y="445.5" font-size="12.5" fill="#374151">Giảm</text>
<rect x="66" y="468" width="258" height="200" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<rect x="66" y="468" width="258" height="30" rx="10" fill="#16a34a"/><rect x="66" y="486" width="258" height="12" fill="#16a34a"/>
<text x="195" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Dẫn dắt sớm</text>
<text x="82" y="530" font-size="13.5" fill="#111827">• Chứng khoán (SSI, VCI, HCM, VIX)</text>
<text x="82" y="566" font-size="13.5" fill="#111827">• Ngân hàng (TCB, MBB, VPB, ACB)</text>
<text x="82" y="602" font-size="13.5" fill="#111827">• BĐS dân cư (VHM, NLG, KDH)</text>
<text x="82" y="638" font-size="13.5" fill="#111827">• Bán lẻ – tiêu dùng (MWG, PNJ, FRT)</text>
<rect x="336" y="468" width="258" height="200" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<rect x="336" y="468" width="258" height="30" rx="10" fill="#2563eb"/><rect x="336" y="486" width="258" height="12" fill="#2563eb"/>
<text x="465" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Dẫn dắt giữa chu kỳ</text>
<text x="352" y="530" font-size="13.5" fill="#111827">• Thép, VLXD (HPG, HSG, NKG)</text>
<text x="352" y="566" font-size="13.5" fill="#111827">• Đầu tư công (VCG, HHV, CII)</text>
<text x="352" y="602" font-size="13.5" fill="#111827">• KCN, cảng (KBC, IDC, GMD)</text>
<text x="352" y="638" font-size="13.5" fill="#111827">• Công nghệ (FPT, CMG)</text>
<rect x="606" y="468" width="258" height="200" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/>
<rect x="606" y="468" width="258" height="30" rx="10" fill="#ea580c"/><rect x="606" y="486" width="258" height="12" fill="#ea580c"/>
<text x="735" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Hưởng lợi giá hàng hoá</text>
<text x="622" y="530" font-size="13.5" fill="#111827">• Dầu khí (PVS, PVD, GAS, BSR)</text>
<text x="622" y="566" font-size="13.5" fill="#111827">• Hoá chất, phân bón (DGC, DPM)</text>
<text x="622" y="602" font-size="13.5" fill="#111827">• Cao su, khoáng sản (GVR, PHR)</text>
<text x="622" y="638" font-size="13.5" fill="#111827">• Ngân hàng CASA cao (chọn lọc)</text>
<rect x="876" y="468" width="258" height="200" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<rect x="876" y="468" width="258" height="30" rx="10" fill="#dc2626"/><rect x="876" y="486" width="258" height="12" fill="#dc2626"/>
<text x="1005" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Phòng thủ (giảm ít hơn)</text>
<text x="892" y="530" font-size="13.5" fill="#111827">• Điện, nước (POW, REE, NT2)</text>
<text x="892" y="566" font-size="13.5" fill="#111827">• Dược (DHG, IMP)</text>
<text x="892" y="602" font-size="13.5" fill="#111827">• Tiêu dùng thiết yếu (VNM)</text>
<text x="892" y="638" font-size="13.5" fill="#111827">• Tiền mặt, tiền gửi</text>
<text x="600" y="702" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111827">Quy tắc: vĩ mô đề xuất ngành ứng viên → giá phê duyệt (RRG, tỷ lệ chỉ số ngành / VN-Index) → chỉ chọn top 1–3 mã của ngành.</text>
<text x="600" y="726" text-anchor="middle" font-size="12.5" fill="#6b7280">Ở VN biến dẫn là lãi suất – tín dụng (không phải GDP). Độ đồng pha cao: nhóm phòng thủ vẫn giảm trong nhịp bán tháo, chỉ giảm ít hơn.</text>
<text x="600" y="752" text-anchor="middle" font-size="11.5" fill="#9ca3af">Lesson 5 · Nguồn khung: Fidelity AART Business Cycle Approach · Bối cảnh VN 2026: NHNN, ADB, UOB, Standard Chartered</text>
</svg>