<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
<defs><style>text{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker></defs>
<rect width="1200" height="640" rx="14" fill="#fff"/>
<text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">7 cấu trúc tạo đáy lớn — buổi 3 (Lesson 5)</text>
<text x="600" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Nét liền = giá · nét đứt = pivot / đường cổ · mũi tên xanh = điểm bứt phá cần vol khớp lệnh ≥1,5× TB50</text>
<g transform="translate(20,78)">
<rect width="285" height="250" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="14" y="26" font-size="15" font-weight="700" fill="#111827">1. Hai đáy (W) có undercut</text>
<g transform="translate(12,48)">
<line x1="0" y1="62" x2="260" y2="62" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<polyline points="20,25 70,110 110,62 150,120 200,62 245,28" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="223" y1="64" x2="251" y2="20" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<text x="2" y="57" font-size="11" fill="#6b7280">pivot</text>
<text x="150" y="135" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">undercut</text>
</g>
<text x="14" y="220" font-size="12" fill="#374151">Đáy 2 thủng nhẹ đáy 1 (rũ stop cuối cùng)</text>
<text x="14" y="237" font-size="12" fill="#6b7280">pivot = đỉnh giữa chữ W</text>
</g>
<g transform="translate(310,78)">
<rect width="285" height="250" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="14" y="26" font-size="15" font-weight="700" fill="#111827">2. Ba đáy / đáy tăng dần</text>
<g transform="translate(12,48)">
<line x1="0" y1="65" x2="260" y2="65" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<polyline points="15,22 50,110 80,65 115,110 145,65 180,104 210,65 245,28" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="223" y1="67" x2="251" y2="20" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<text x="2" y="60" font-size="11" fill="#6b7280">pivot</text>
</g>
<text x="14" y="220" font-size="12" fill="#374151">3 lần test hỗ trợ, vol giảm dần mỗi lần</text>
<text x="14" y="237" font-size="12" fill="#6b7280">pivot = đỉnh nền</text>
</g>
<g transform="translate(600,78)">
<rect width="285" height="250" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="14" y="26" font-size="15" font-weight="700" fill="#111827">3. Vai đầu vai ngược</text>
<g transform="translate(12,48)">
<line x1="0" y1="60" x2="260" y2="60" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<polyline points="15,30 45,92 72,60 110,128 150,60 185,94 212,60 245,24" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="223" y1="62" x2="251" y2="16" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<text x="2" y="55" font-size="11" fill="#6b7280">pivot</text>
<text x="110" y="143" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">đầu</text>
</g>
<text x="14" y="220" font-size="12" fill="#374151">Vai phải vol thấp, cao hơn đầu</text>
<text x="14" y="237" font-size="12" fill="#6b7280">breakout đường cổ kèm vol</text>
</g>
<g transform="translate(890,78)">
<rect width="285" height="250" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="14" y="26" font-size="15" font-weight="700" fill="#111827">4. Đáy tròn (đĩa)</text>
<g transform="translate(12,48)">
<line x1="0" y1="34" x2="260" y2="34" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M15,28 C60,128 190,128 232,34 L245,20" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="223" y1="36" x2="251" y2="12" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<text x="2" y="29" font-size="11" fill="#6b7280">pivot</text>
</g>
<text x="14" y="220" font-size="12" fill="#374151">Nhiều tháng, vol cũng hình chữ U</text>
<text x="14" y="237" font-size="12" fill="#6b7280">thiếu pivot rõ → chờ tay cầm</text>
</g>
<g transform="translate(20,340)">
<rect width="285" height="250" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="14" y="26" font-size="15" font-weight="700" fill="#111827">5. Cốc tay cầm</text>
<g transform="translate(12,48)">
<line x1="0" y1="32" x2="260" y2="32" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M15,28 C50,128 150,128 185,32 L200,50 L212,43 L224,53 L245,16" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="223" y1="34" x2="251" y2="8" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<text x="2" y="27" font-size="11" fill="#6b7280">pivot</text>
<text x="206" y="65" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">tay cầm</text>
</g>
<text x="14" y="220" font-size="12" fill="#374151">Tay cầm 1–2 tuần, drift 8–12%</text>
<text x="14" y="237" font-size="12" fill="#6b7280">chi tiết ở trang 03</text>
</g>
<g transform="translate(310,340)">
<rect width="285" height="250" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="14" y="26" font-size="15" font-weight="700" fill="#111827">6. Tích luỹ Wyckoff</text>
<g transform="translate(12,48)">
<line x1="0" y1="56" x2="260" y2="56" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<polyline points="15,12 45,102 70,56 95,96 122,60 150,122 172,86 195,54 215,70 245,24" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="223" y1="58" x2="251" y2="16" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<text x="2" y="51" font-size="11" fill="#6b7280">pivot</text>
<text x="45" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">SC</text>
<text x="70" y="49" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">AR</text>
<text x="95" y="111" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">ST</text>
<text x="150" y="137" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Spring</text>
<text x="195" y="47" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">SOS</text>
<text x="215" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">LPS</text>
<line x1="0" y1="102" x2="260" y2="102" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2 3"/>
</g>
<text x="14" y="220" font-size="12" fill="#374151">SC → AR → ST → Spring → SOS → LPS</text>
<text x="14" y="237" font-size="12" fill="#6b7280">mua: SOS (breakout) hoặc LPS (pullback)</text>
</g>
<g transform="translate(600,340)">
<rect width="285" height="250" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="14" y="26" font-size="15" font-weight="700" fill="#111827">7. Đáy V → nền cao</text>
<g transform="translate(12,48)">
<line x1="0" y1="42" x2="260" y2="42" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<polyline points="15,15 90,126 158,42 172,52 186,44 200,53 214,46 245,14" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="223" y1="44" x2="251" y2="6" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<text x="2" y="37" font-size="11" fill="#6b7280">pivot</text>
<text x="90" y="141" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">cao trào bán</text>
</g>
<text x="14" y="220" font-size="12" fill="#374151">Không mua chữ V khi đang hình thành</text>
<text x="14" y="237" font-size="12" fill="#6b7280">chờ nền ngắn/tay cầm ở 1/3 trên</text>
</g>
<g transform="translate(890,340)"><rect width="285" height="250" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="14" y="28" font-size="12.5" font-weight="700" fill="#7c2d12">Điều kiện chung của đáy LỚN</text>
<text x="14" y="50" font-size="12.5" fill="#7c2d12">• Sau Stage 4 đủ dài (thường 3–6 tháng)</text>
<text x="14" y="72" font-size="12.5" fill="#7c2d12">• Cạn cung: vol các nhịp giảm co dần</text>
<text x="14" y="94" font-size="12.5" fill="#7c2d12">• RS line đi lên trước giá</text>
<text x="14" y="116" font-size="12.5" fill="#7c2d12">• Có chất xúc tác: LN quý, chu kỳ ngành</text>
<text x="14" y="138" font-size="12.5" fill="#7c2d12">• Breakout = nền 1 của Stage 2</text>
<text x="14" y="160" font-size="12.5" font-weight="700" fill="#7c2d12">Bulkowski (Mỹ, bull market):</text>
<text x="14" y="182" font-size="12.5" fill="#7c2d12">VĐV ngược: fail 11%, TB +45%</text>
<text x="14" y="204" font-size="12.5" fill="#7c2d12">Ba đáy: fail 13%, TB +46%</text>
<text x="14" y="226" font-size="12.5" fill="#7c2d12">Throwback ~65% → điểm mua thứ 2</text>
</g>
</svg>